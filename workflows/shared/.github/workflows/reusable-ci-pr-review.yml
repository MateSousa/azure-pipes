# Reusable workflow: PR Review Agent
#
# Runs the AWS Bedrock-backed PR review agent and posts its suggestions as a
# PR comment. The agent script lives at <agents-path>/pr-review.mjs.
#
# Usage from application repos:
#   uses: your-org/shared-workflows/.github/workflows/reusable-ci-pr-review.yml@main

name: PR Review Agent

on:
  workflow_call:
    inputs:
      aws-region:
        description: "AWS region for Bedrock"
        required: false
        type: string
        default: "us-east-1"
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      agents-path:
        description: "Path to the directory holding pr-review.mjs and its package.json"
        required: false
        type: string
        default: "agents"
      runs-on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      BEDROCK_MODEL_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Run PR Review Agent
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Install agent dependencies
        run: npm install
        working-directory: ${{ inputs.agents-path }}

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" > /tmp/pr.diff

      - name: Run PR review agent
        id: review
        env:
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          export PR_DIFF=$(cat /tmp/pr.diff)
          node "${{ inputs.agents-path }}/pr-review.mjs" > /tmp/review.txt

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## AI Code Review"
            echo ""
            cat /tmp/review.txt
            echo ""
            echo "---"
            echo "*Generated by App PR Review Agent — review suggestions, not mandates.*"
          } > /tmp/comment.txt
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.txt
