# Caller workflow: ESLint Guardian
# Place this in the application repo at .github/workflows/ci-eslint-guardian.yml

name: ESLint Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [development]
    paths:
      - 'App.Modern.Merged/app-ui/src/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    uses: your-org/shared-workflows/.github/workflows/reusable-ci-eslint-guardian.yml@main
    with:
      runs-on: ubuntu-latest-4-cores
    secrets: inherit
